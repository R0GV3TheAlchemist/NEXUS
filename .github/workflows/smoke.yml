name: Smoke

# Fast gate: CLI contract + Super-Simulation initialization.
# Failures here should block merge confidence on every push and pull request.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    name: CLI and simulation smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: CLI help (import-safe startup)
        run: python -m nexus --help

      - name: CLI smoke tests
        run: python -m unittest tests.cli_smoke_tests -v

      - name: Simulation smoke tests
        run: python -m unittest tests.simulation_smoke_tests -v

      - name: Discover all smoke modules
        run: python -m unittest discover -s tests -p "*smoke*.py" -v
